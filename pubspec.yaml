name: again_islami

description: "A new Flutter project."
publish_to: 'none' # لا تُنشر على pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  animate_do: ^4.2.0
  adhan: ^2.0.0
  hijri: ^3.0.0
  intl: ^0.20.2
  provider: ^6.1.5
  carousel_slider: ^5.0.0
  smooth_page_indicator: ^1.2.1
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.0

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icons/logo_a.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/files/
    - assets/icons/
    - assets/fonts/
